<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>OK Studio Folio</title>
<script>document.documentElement.classList.add('js')</script>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%230c0c0d'/%3E%3Cpath d='M8 32 Q32 -6 56 32 Q32 70 8 32Z' fill='none' stroke='%23efebe4' stroke-width='6' stroke-linejoin='round'/%3E%3Ccircle cx='32' cy='32' r='10' fill='%23ff4b2b'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@300;400;500;600&family=Geologica:wght@300;400;500&family=Martian+Mono:wght@400&display=swap" rel="stylesheet">
<style>
/* Layout idea: a dark cinematic studio reel. WebGL liquid hero, giant tight grotesk with italic-serif accents,
   an index of work with a cursor-following video preview, and full-screen expand transitions into each case. */
:root{
  --bg:#0c0c0d; --bg2:#151517; --ink:#efebe4; --mute:#8f8b84; --line:rgba(239,235,228,.14); --accent:#ff4b2b;
  --disp:"Unbounded","Geologica",system-ui,sans-serif; --serif:"Unbounded",system-ui,sans-serif;
  --mono:"Martian Mono",ui-monospace,monospace; --body:"Geologica",system-ui,sans-serif;
  --ease:cubic-bezier(.76,0,.24,1); --out:cubic-bezier(.16,1,.3,1);
  color-scheme:dark;
}
*{box-sizing:border-box;margin:0;padding:0}
html.lenis,html.lenis body{height:auto}
.lenis.lenis-smooth{scroll-behavior:auto!important}
body{background:var(--bg);color:var(--ink);font:400 17px/1.55 var(--body);-webkit-font-smoothing:antialiased;overflow-x:hidden}
img,video{display:block;max-width:100%}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:4px}
::selection{background:var(--accent);color:#fff}
.wrap{width:min(1440px,100% - 48px);margin-inline:auto}
.mono{font:400 .68rem/1.5 var(--mono);letter-spacing:.04em;text-transform:uppercase}
em{font-style:normal;color:transparent;background:linear-gradient(100deg,#ff4b2b,#ff2d87 45%,#7a5cff 90%);-webkit-background-clip:text;background-clip:text;background-size:200% 100%;animation:shine 6s ease-in-out infinite alternate}
@keyframes shine{to{background-position:100% 0}}
[hidden]{display:none!important}

/* loader */
#loader{position:fixed;inset:0;z-index:100;background:var(--bg);display:none;flex-direction:column;justify-content:space-between;padding:24px;clip-path:inset(0)}
.js #loader{display:flex}
#loader .l-top{display:flex;justify-content:space-between}
#loader .l-num{font:400 clamp(5rem,18vw,16rem)/.85 var(--disp);letter-spacing:-.06em;align-self:flex-end;font-variant-numeric:tabular-nums}
#loader .l-bar{position:absolute;left:0;bottom:0;height:2px;background:var(--accent);width:0}


/* eye mark */
.lid,.pup,.dlid,.dout,.dpup{transform-box:fill-box;transform-origin:center}
@keyframes dout{0%,14%{opacity:0;transform:scaleY(.04)}16%{opacity:1;transform:scaleY(.04)}24%{opacity:1;transform:scaleY(1)}80%{opacity:1;transform:scaleY(1)}88%{opacity:1;transform:scaleY(.04)}90%,100%{opacity:0;transform:scaleY(.04)}}
@keyframes dlid{0%,50%{transform:scaleY(1)}53%{transform:scaleY(.06)}56%,100%{transform:scaleY(1)}}
@keyframes dpup{0%,14%{transform:translate(0,0) scale(2.4)}24%{transform:translate(0,0) scale(1)}31%,38%{transform:translate(-26px,3px) scale(1)}45%,50%{transform:translate(26px,-6px) scale(1)}60%,70%{transform:translate(0,-18px) scale(1)}78%,80%{transform:translate(0,0) scale(1)}88%,100%{transform:translate(0,0) scale(2.4)}}
.logo{position:fixed;left:24px;top:16px;z-index:51;display:flex;align-items:baseline;gap:.45rem;color:#efebe4;text-decoration:none}
.lg-mark{display:flex;align-items:baseline}
.lg-mark svg{width:24px;height:24px;margin-bottom:-2.4px;margin-right:1px;overflow:visible}
.lg-k{font:600 32px/.9 var(--disp);letter-spacing:-.06em}
.lg-st{font:400 .62rem/1 var(--mono);letter-spacing:.32em;text-transform:uppercase;opacity:.85}
.logo .dout{opacity:0;transform:scaleY(.04)}
.logo .dpup{transform:scale(2.4)}
.logo.wake .dout{animation:dout 5.6s cubic-bezier(.7,0,.2,1) 1}
.logo.wake .dlid{animation:dlid 5.6s cubic-bezier(.7,0,.2,1) 1}
.logo.wake .dpup{animation:dpup 5.6s cubic-bezier(.65,0,.25,1) 1}
.hdr .spacer{display:block;width:1px}
#loader .l-eye{position:absolute;left:50%;top:50%;width:min(34vw,260px);transform:translate(-50%,-50%)}
#loader .l-eye svg{width:100%;height:auto;display:block}
#loader .lid{animation:ldlid 1.9s cubic-bezier(.7,0,.2,1) both}
#loader .pup{animation:ldpup 1.9s cubic-bezier(.65,0,.25,1) both}
@keyframes ldlid{0%{transform:scaleY(.04)}28%{transform:scaleY(1)}72%{transform:scaleY(1)}78%{transform:scaleY(.08)}84%,100%{transform:scaleY(1)}}
@keyframes ldpup{0%,28%{transform:translate(0,0)}42%,52%{transform:translate(-30px,4px)}64%,72%{transform:translate(30px,-6px)}86%,100%{transform:translate(0,0)}}
@media (prefers-reduced-motion:reduce){.logo.wake .dout,.logo.wake .dlid,.logo.wake .dpup{animation:none}}

/* cursor */
#cur{position:fixed;left:0;top:0;z-index:90;pointer-events:none;mix-blend-mode:difference;display:none}
#cur .dot{position:absolute;width:8px;height:8px;margin:-4px 0 0 -4px;border-radius:50%;background:#fff}
#cur .ring{position:absolute;width:84px;height:84px;margin:-42px 0 0 -42px;border-radius:50%;background:#fff;color:#000;display:grid;place-items:center;font:500 .72rem var(--mono);letter-spacing:.08em;text-transform:uppercase;transform:scale(0);transition:transform .45s var(--out)}
#cur.on .ring{transform:scale(1)}
#cur.on .dot{opacity:0}
@media (hover:hover) and (pointer:fine){#cur{display:block}body.has-cur,body.has-cur a,body.has-cur button{cursor:none}}

/* header */
.hdr{position:fixed;top:0;left:0;right:0;z-index:50;mix-blend-mode:difference;color:#fff;padding:22px 24px;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:1rem}
.hdr nav{display:flex;gap:2rem}
.hdr nav a{font:400 .78rem var(--mono);text-transform:uppercase;letter-spacing:.08em;position:relative}
.hdr nav a::after{content:"";position:absolute;left:0;right:0;bottom:-4px;height:1px;background:currentColor;transform:scaleX(0);transform-origin:right;transition:transform .5s var(--out)}
.hdr nav a:hover::after{transform:scaleX(1);transform-origin:left}
.hdr .right{display:flex;justify-content:flex-end;align-items:center;gap:1.4rem}
.clock{font:400 .74rem var(--mono);letter-spacing:.06em;opacity:.8}
.lang{display:flex;gap:.6rem;font:400 .78rem var(--mono)}
.lang button{opacity:.45;padding:2px 0;border-bottom:1px solid transparent}
.lang button[aria-pressed="true"]{opacity:1;border-color:currentColor}

/* hero */
.hero{position:relative;min-height:min(100svh,980px);display:flex;flex-direction:column;justify-content:flex-end;padding:120px 0 28px;overflow:hidden;background:radial-gradient(ellipse at 70% 40%,#ff2d87 0%,#5a1fd0 35%,#120620 75%)}
.hero::after{content:"";position:absolute;inset:auto 0 0 0;height:45%;background:linear-gradient(180deg,rgba(12,12,13,0),rgba(12,12,13,.55));pointer-events:none;z-index:1}
#gl{position:absolute;inset:0;width:100%;height:100%}
.hero .wrap{position:relative;z-index:2}
.h1{font:500 clamp(2.5rem,7.4vw,8.6rem)/.95 var(--disp);letter-spacing:-.06em;text-wrap:balance}
.ln{display:block;overflow:hidden;padding-bottom:.06em;margin-bottom:-.06em}
.ln>span{display:inline-block;transition:transform 1.3s var(--out)}
.js:not(.ready) .hero .ln>span{transform:translateY(110%)}
.hero .ln:nth-child(2)>span{transition-delay:.08s}.hero .ln:nth-child(3)>span{transition-delay:.16s}
.h-foot{display:grid;grid-template-columns:repeat(12,1fr);gap:24px;margin-top:3.5rem;align-items:end}
.h-sub{grid-column:1/6;font-size:1.12rem;max-width:40ch;color:#f3eee8}
.h-meta{grid-column:8/13;display:flex;justify-content:space-between;gap:1rem;color:#e6dfd6}
.scroll-ind{display:inline-flex;gap:.6rem;align-items:center}
.scroll-ind i{width:1px;height:28px;background:var(--ink);transform-origin:top;animation:sc 2s var(--ease) infinite}
@keyframes sc{0%{transform:scaleY(0)}50%{transform:scaleY(1);transform-origin:top}51%{transform-origin:bottom}100%{transform:scaleY(0);transform-origin:bottom}}


/* red screen: card grows to full bleed on scroll; words flip frame by frame */
.red{padding:0;background:var(--bg)}
.red-card{position:relative;overflow:hidden;color:#fff;background:#f2241a;min-height:min(92svh,860px);display:flex;flex-direction:column;justify-content:space-between;padding:clamp(4.5rem,7vw,5.5rem) clamp(1.4rem,3vw,2.4rem) clamp(1.4rem,3vw,2.4rem);will-change:margin,border-radius}
.red-card .bl{position:absolute;border-radius:50%;filter:blur(80px);pointer-events:none}
.red-card .bl1{width:60vw;height:60vw;background:#ff2a5c;left:-20vw;top:-25vw;opacity:.5;animation:rb1 11s ease-in-out infinite alternate}
.red-card .bl2{width:55vw;height:55vw;background:#ff8a1a;right:-18vw;bottom:-30vw;opacity:.8;animation:rb2 13s ease-in-out infinite alternate}
.red-card .bl3{width:28vw;height:28vw;background:#ffd0c0;left:45%;top:35%;opacity:.35;animation:rb1 9s ease-in-out infinite alternate-reverse}
@keyframes rb1{to{transform:translate(14vw,10vw) scale(1.15)}}
@keyframes rb2{to{transform:translate(-12vw,-8vw) scale(.9)}}
.red-card::after{content:"";position:absolute;inset:0;pointer-events:none;opacity:.22;mix-blend-mode:overlay;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>")}
.red-card>*{position:relative;z-index:2}
.red-top,.red-bot{display:flex;justify-content:space-between;gap:1rem;align-items:flex-end}
.red-mid{text-align:center;padding:2rem 0}
.red-mid .pre{font:400 clamp(1rem,1.6vw,1.4rem)/1.2 var(--disp);letter-spacing:-.04em;opacity:.9}
.flip{min-height:2.1em;display:grid;place-items:center;font:600 clamp(2.6rem,9vw,9.6rem)/.95 var(--disp);letter-spacing:-.075em;margin:.25em 0 .2em;text-wrap:balance}
.flip span{display:inline-block;max-width:12ch}
.red-mid .post{max-width:38ch;margin:0 auto;font-size:1.1rem;opacity:.92}
.cta-w{display:inline-flex;align-items:center;gap:.8rem;padding:1rem 1.6rem;border-radius:99px;background:#fff;color:#1a0503;font:500 1rem var(--body);transition:transform .4s var(--out)}
.cta-w:hover{transform:scale(1.05)}
.fcount{font-variant-numeric:tabular-nums}

/* marquee */
.mq{border-block:1px solid var(--line);overflow:hidden;padding:1.4rem 0;white-space:nowrap}
.mq .track{display:inline-flex;gap:3rem;animation:mq 38s linear infinite;font:400 clamp(1.8rem,3.6vw,3.4rem)/1 var(--disp);letter-spacing:-.05em}
.mq .track span{display:inline-flex;align-items:center;gap:3rem}
.mq .track span::after{content:"";width:.32em;height:.32em;border-radius:50%;background:var(--accent)}
@keyframes mq{to{transform:translateX(-50%)}}

/* sections */
section.sec{padding:clamp(5rem,11vw,10rem) 0}
.sec-top{display:grid;grid-template-columns:repeat(12,1fr);gap:24px;align-items:end;margin-bottom:clamp(2.5rem,5vw,4.5rem)}
.sec-top h2{grid-column:1/9;font:500 clamp(2.2rem,4.8vw,4.8rem)/1 var(--disp);letter-spacing:-.06em}
.sec-top h2 sup{font:400 .9rem var(--mono);color:var(--accent);vertical-align:top;margin-left:.4rem;letter-spacing:0}
.sec-top p{grid-column:9/13;color:var(--mute);max-width:36ch}

/* work index */
.idx-head{display:grid;grid-template-columns:4rem 1fr 18rem 12rem 4rem;gap:24px;padding:0 0 .9rem;color:var(--mute);border-bottom:1px solid var(--line)}
.rows{position:relative}
.row{display:grid;grid-template-columns:4rem 1fr 18rem 12rem 4rem;gap:24px;align-items:center;padding:1.7rem 0;border-bottom:1px solid var(--line);transition:opacity .5s var(--out)}
.r-no,.r-client,.r-disc,.r-year{font:400 .78rem var(--mono);letter-spacing:.05em;text-transform:uppercase;color:var(--mute)}
.r-title{font:500 clamp(1.9rem,4.4vw,4.3rem)/1 var(--disp);letter-spacing:-.06em;transition:transform .7s var(--out);display:block}
.r-thumb{display:none}
.rows.hov .row{opacity:.22}
.rows.hov .row.act{opacity:1}
.row.act .r-title{transform:translateX(1.4rem)}
.row.act .r-title::before{content:"→ ";color:var(--accent)}

/* floating preview */
#pv{position:fixed;left:0;top:0;width:clamp(260px,30vw,480px);aspect-ratio:16/10;z-index:40;pointer-events:none;border-radius:6px;overflow:hidden;transform:translate(-50%,-50%) scale(0);opacity:0;transition:opacity .35s,width .4s;background:#000}
#pv>*{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0;transition:opacity .35s}
#pv>.on{opacity:1}

/* generated cover for projects without footage yet */
.gen-ua{position:relative;overflow:hidden;background:#1d4fd1;display:grid;place-items:center;container-type:size}
.gen-ua::before{content:"";position:absolute;left:0;right:0;bottom:0;height:50%;background:#ffd23f;transform-origin:bottom;animation:rise 5s var(--ease) infinite alternate}
.gen-ua::after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(90deg,rgba(255,255,255,.14) 0 1px,transparent 1px 56px);animation:lines 9s linear infinite}
.gen-ua b{position:relative;z-index:1;font:500 4rem/1 var(--disp);font-size:15cqw;letter-spacing:-.06em;color:#fff;mix-blend-mode:difference}
@keyframes rise{from{transform:scaleY(.82)}to{transform:scaleY(1.08)}}
@keyframes lines{to{background-position:56px 0}}

/* studio */
.manifesto{font:400 clamp(1.6rem,3.4vw,3.3rem)/1.15 var(--disp);letter-spacing:-.05em;max-width:24ch}
.manifesto .w{color:#4b4945;transition:color .4s}
.manifesto .w.lit{color:var(--ink)}
.manifesto em{color:var(--accent)}
.stats{display:grid;grid-template-columns:repeat(12,1fr);gap:24px;margin-top:clamp(3.5rem,7vw,6rem);border-top:1px solid var(--line);padding-top:2rem}
.stat{grid-column:span 4}
.stat b{display:block;font:400 clamp(3rem,6.8vw,6.4rem)/.95 var(--disp);letter-spacing:-.07em;font-variant-numeric:tabular-nums}
.stat span{display:block;margin-top:.8rem;color:var(--mute)}

/* services */
.svc{border-top:1px solid var(--line)}
.svc-row{display:grid;grid-template-columns:4rem 1fr 1fr;gap:24px;padding:2.2rem 0;border-bottom:1px solid var(--line);align-items:start;position:relative;overflow:hidden}
.svc-row::before{content:"";position:absolute;inset:0;background:var(--accent);transform:scaleY(0);transform-origin:bottom;transition:transform .7s var(--ease);z-index:0}
.svc-row:hover::before{transform:scaleY(1)}
.svc-row>*{position:relative;z-index:1;transition:color .5s}
.svc-row:hover>*,.svc-row:hover p,.svc-row:hover .mono{color:#140705}
.svc-row:hover .tags span{opacity:1}
.svc-row h3{font:500 clamp(1.6rem,3vw,2.8rem)/1.05 var(--disp);letter-spacing:-.06em}
.svc-row p{color:var(--mute);max-width:42ch}
.svc-row .tags{display:flex;flex-wrap:wrap;gap:.5rem;margin-top:1rem}
.svc-row .tags span{border:1px solid currentColor;border-radius:99px;padding:.2rem .75rem;font:400 .72rem var(--mono);text-transform:uppercase;letter-spacing:.05em;opacity:.8}

/* audiences */
.aud{display:grid;grid-template-columns:1fr 1fr;gap:24px}
.aud article{border:1px solid var(--line);border-radius:4px;padding:clamp(1.6rem,3vw,2.8rem);display:flex;flex-direction:column;gap:1.4rem;min-height:22rem;background:var(--bg2)}
.aud h3{font:500 clamp(1.5rem,2.4vw,2.3rem)/1.08 var(--disp);letter-spacing:-.05em}
.aud p{color:#cfcac2;max-width:44ch}
.aud .when{margin-top:auto;color:var(--accent)}

/* process */
.steps{display:grid;grid-template-columns:repeat(6,1fr);gap:24px;counter-reset:s}
.step{counter-increment:s;position:relative;border-top:1px solid var(--line);padding:1.2rem 0 .4rem}
.step::before{content:counter(s,decimal-leading-zero);display:block;font:400 clamp(2.2rem,3.4vw,3.2rem)/1 var(--disp);letter-spacing:-.06em;color:#3a3835;transition:color .6s var(--out),transform .8s var(--out);transform-origin:left bottom}
.step::after{content:"";position:absolute;left:0;top:-1px;height:2px;width:100%;background:linear-gradient(90deg,#ff4b2b,#ff2d87);transform:scaleX(var(--p,0));transform-origin:left}
.step h3{font:500 1.25rem/1.15 var(--disp);letter-spacing:-.05em;margin:1rem 0 .5rem;color:#8a8680;transition:color .6s var(--out),transform .8s var(--out);transform:translateY(6px)}
.step p{color:#8a8680;font-size:.95rem;transition:color .6s var(--out)}
.step.on::before{color:var(--accent);transform:scale(1.08)}
.step.on h3{color:var(--ink);transform:none}
.step.on p{color:#d8d3cb}
.pay{margin-top:2.5rem;color:var(--mute)}

/* contact */
.contact{padding:clamp(6rem,14vw,12rem) 0 3rem}
.big{font:500 clamp(2.8rem,9.4vw,10.4rem)/.92 var(--disp);letter-spacing:-.07em;display:block}
.c-row{display:grid;grid-template-columns:repeat(12,1fr);gap:24px;margin-top:3rem;align-items:end}
.c-row p{grid-column:1/6;color:var(--mute);max-width:40ch}
.cta{grid-column:8/13;justify-self:end;display:inline-flex;align-items:center;gap:1rem;padding:1.3rem 2rem;border-radius:99px;background:var(--ink);color:var(--bg);font:500 1.05rem var(--body);transition:background .4s,color .4s}
.cta:hover{background:var(--accent);color:#fff}
.cta i{font-style:normal;transition:transform .4s var(--out)}
.cta:hover i{transform:translateX(6px)}
footer{border-top:1px solid var(--line);padding:1.6rem 0 2rem;color:var(--mute)}
.socials{display:flex;flex-wrap:wrap;gap:2.5rem;margin-top:3.5rem;font-size:.9rem;letter-spacing:.12em;text-transform:uppercase}
.socials a{display:inline-flex;gap:.6rem;align-items:center;padding-bottom:.4rem;border-bottom:1px solid var(--line);transition:color .3s,border-color .3s}
.socials a i{font-style:normal;transition:transform .3s}
.socials a:hover{color:var(--accent);border-color:var(--accent)}
.socials a:hover i{transform:translate(3px,-3px)}
footer a:hover{color:var(--ink)}
footer .wrap{display:flex;flex-wrap:wrap;justify-content:space-between;gap:1rem}

/* transition overlay */
#tx{position:fixed;z-index:80;left:0;top:0;width:100vw;height:100vh;overflow:hidden;display:none;background:var(--ink)}
#tx>*{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}

/* case */
.c-hero{position:relative;height:100svh;min-height:560px;overflow:hidden;display:flex;align-items:flex-end;padding-bottom:4vh;background:var(--pc,#222)}
.c-media,.c-media>*{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.c-shade{position:absolute;inset:0;background:linear-gradient(180deg,rgba(12,12,13,.35) 0%,rgba(12,12,13,0) 30%,rgba(12,12,13,.15) 55%,rgba(12,12,13,.92) 100%)}
.c-head{position:relative;z-index:2}
.c-title{font:500 clamp(2.6rem,7.6vw,8.8rem)/.95 var(--disp);letter-spacing:-.065em;margin-top:1rem;text-wrap:balance}
.c-title .ln>span{transition:transform 1.2s var(--out) .1s}
.case.pre .c-title .ln>span{transform:translateY(110%)}
.c-back{position:fixed;left:24px;top:68px;z-index:45;display:inline-flex;gap:.6rem;align-items:center;padding:.75rem 1.2rem;border-radius:99px;background:rgba(12,12,13,.55);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border:1px solid var(--line)}
.c-intro{display:grid;grid-template-columns:repeat(12,1fr);gap:24px;padding:clamp(4rem,8vw,7rem) 0 clamp(3rem,6vw,5rem)}
.c-lead{grid-column:1/9;font:400 clamp(1.5rem,2.7vw,2.6rem)/1.18 var(--disp);letter-spacing:-.05em;text-wrap:balance}
.c-meta{grid-column:9/13;display:grid;gap:1.2rem;align-content:start}
.c-meta div{border-top:1px solid var(--line);padding-top:.7rem}
.c-meta dt{color:var(--mute)}
.c-meta dd{margin-top:.25rem}
.c-block{display:grid;grid-template-columns:repeat(12,1fr);gap:24px;padding:clamp(2.5rem,5vw,4rem) 0;border-top:1px solid var(--line)}
.c-block>.lbl{grid-column:1/4;color:var(--mute)}
.c-block>.bd{grid-column:4/12}
.c-text{font-size:clamp(1.15rem,1.6vw,1.45rem);line-height:1.45;max-width:46ch;color:#ddd8d0}
.c-list{list-style:none;counter-reset:i}
.c-list li{counter-increment:i;display:grid;grid-template-columns:3.5rem 1fr;padding:1rem 0;border-bottom:1px solid var(--line);font:400 clamp(1.1rem,1.9vw,1.7rem)/1.2 var(--disp);letter-spacing:-.045em}
.c-list li::before{content:counter(i,decimal-leading-zero);font:400 .78rem var(--mono);color:var(--accent);padding-top:.5em}
.quote{padding:clamp(4rem,9vw,8rem) 0;text-align:center}
.quote p{font:400 clamp(1.7rem,3.8vw,3.6rem)/1.12 var(--disp);letter-spacing:-.055em;max-width:26ch;margin:0 auto;text-wrap:balance}
.quote span{display:block;margin-top:1.6rem;color:var(--mute)}
.c-res{display:grid;grid-template-columns:repeat(3,1fr);gap:24px}
.c-logos{display:flex;flex-wrap:wrap;align-items:center;gap:2.2rem 3.2rem}.c-logos img{width:auto;opacity:.82;transition:opacity .3s}.c-logos img:hover{opacity:1}
.logos{display:grid;grid-template-columns:repeat(5,1fr);border-top:1px solid var(--line);border-left:1px solid var(--line)}
.logos span{display:grid;place-items:center;height:clamp(110px,11vw,160px);border-right:1px solid var(--line);border-bottom:1px solid var(--line);padding:0 1.4rem}
.logos img{max-width:100%;width:auto;opacity:.6;transition:opacity .35s,transform .5s var(--out)}.logos span:hover img{opacity:1;transform:scale(1.05)}
@media (max-width:800px){.logos{grid-template-columns:repeat(3,1fr)}.logos img{transform:scale(.72)}}
.c-res b{display:block;font:400 clamp(2.8rem,6.4vw,5.8rem)/.95 var(--disp);letter-spacing:-.07em;color:var(--pc2,var(--ink))}
.c-res span{display:block;margin-top:.6rem;color:var(--mute);max-width:22ch}
.films{display:grid;grid-template-columns:repeat(2,1fr);gap:24px}
.films figure:first-child:nth-last-child(odd),.films figure.wide{grid-column:1/-1}
.films video{width:100%;aspect-ratio:16/9;object-fit:cover;background:#000;border-radius:4px}
.films figcaption,.gal figcaption{margin-top:.7rem;color:var(--mute)}
.gal{display:grid;grid-template-columns:repeat(2,1fr);gap:24px;padding-bottom:clamp(3rem,6vw,5rem)}
.gal figure.w{grid-column:1/-1}
.gal img{width:100%;height:100%;object-fit:cover;border-radius:4px;background:var(--bg2)}
.gal figure.w img{aspect-ratio:16/9}
.gal figure.h img{aspect-ratio:4/3}
.c-note{color:var(--mute);font-size:1.1rem}
.next{display:block;position:relative;overflow:hidden;border-top:1px solid var(--line);padding:clamp(4rem,10vw,9rem) 0 clamp(4rem,9vw,8rem);min-height:60vh}
.next .n-media{position:absolute;inset:0;opacity:.22;transition:opacity .9s var(--out),transform 1.4s var(--out);transform:scale(1.06)}
.next .n-media>*{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.next:hover .n-media{opacity:.75;transform:scale(1)}
.next .wrap{position:relative;z-index:2}
.n-title{display:block;margin-top:1.2rem;font:500 clamp(2.6rem,8.6vw,9.6rem)/.92 var(--disp);letter-spacing:-.07em}


.films.vert{grid-template-columns:repeat(4,minmax(0,1fr))}
.films.vert figure{grid-column:auto!important}
.films.vert video{aspect-ratio:9/16}
.gal.gal3{grid-template-columns:repeat(3,minmax(0,1fr))}
.gal video{width:100%;height:100%;object-fit:cover;border-radius:4px;background:var(--bg2);display:block}
.gal figure.w video,.gal figure.h video{aspect-ratio:16/9}
.gal figure.q img{aspect-ratio:1/1}
.gal.gal3 figure.h img{aspect-ratio:16/9}
.gal figure.n img{aspect-ratio:16/9}
.gal figure.p img{aspect-ratio:9/16}
.gal figure.s img{aspect-ratio:4/5;object-position:50% 0;transition:object-position 6s cubic-bezier(.45,0,.2,1)}
.gal figure.s:hover img{object-position:50% 100%}
.gal figure.f{grid-column:1/-1}.gal figure.f img{aspect-ratio:auto;height:auto}
.gal figure.b{grid-column:1/-1;position:relative;border-radius:14px;overflow:hidden;background:#fff;padding-top:38px;box-shadow:0 30px 80px rgba(0,0,0,.35)}
.gal figure.b:before{content:'';position:absolute;left:0;right:0;top:0;height:38px;background:radial-gradient(circle,#ff5f57 5px,transparent 6px) 12px 50%/22px 22px no-repeat,radial-gradient(circle,#febc2e 5px,transparent 6px) 34px 50%/22px 22px no-repeat,radial-gradient(circle,#28c840 5px,transparent 6px) 56px 50%/22px 22px no-repeat,#eceef1}
.gal figure.b:after{content:'';position:absolute;top:9px;left:50%;transform:translateX(-50%);width:34%;height:20px;border-radius:6px;background:#fff}
.gal figure.b img{aspect-ratio:16/10;object-fit:cover;object-position:50% 0;border-radius:0;animation:bsc var(--d,24s) cubic-bezier(.65,0,.35,1) infinite alternate}
.gal figure.b:hover img{animation-play-state:paused}
@keyframes bsc{0%,7%{object-position:50% 0}93%,100%{object-position:50% 100%}}
.gal figure figcaption{margin-top:.8rem;font-size:.72rem;letter-spacing:.12em;text-transform:uppercase;color:var(--mute)}
.gal figure.b figcaption{position:absolute;right:14px;top:11px;margin:0;color:#6b7280;font-size:.62rem}
.c-link{display:inline-flex;gap:.6rem;align-items:center;margin-top:1.8rem;padding:1rem 1.5rem;border-radius:99px;background:var(--ink);color:var(--bg);font:500 1rem var(--body);transition:background .3s,color .3s}
.c-link:hover{background:var(--accent);color:#fff}
.c-link i{font-style:normal}
#pv>img{object-fit:cover}
@media (max-width:1100px){.films.vert{grid-template-columns:repeat(2,minmax(0,1fr))}.gal.gal3{grid-template-columns:repeat(2,minmax(0,1fr))}}

/* responsive */
@media (max-width:1100px){
  .idx-head,.row{grid-template-columns:3rem 1fr 12rem 4rem}
  .idx-head .r-client,.row .r-client{display:none}
  .steps{grid-template-columns:repeat(3,1fr)}
}
@media (max-width:760px){
  body{font-size:16px}
  .wrap{width:calc(100% - 32px)}
  .hdr{padding:16px;grid-template-columns:1fr auto}
  .hdr nav,.clock{display:none}
  .logo{left:16px;top:12px}
  .h-foot,.sec-top,.c-intro,.c-block,.c-row{grid-template-columns:1fr}
  .h-sub,.h-meta,.sec-top h2,.sec-top p,.c-lead,.c-meta,.c-block>.lbl,.c-block>.bd,.c-row p,.cta{grid-column:1/-1}
  .cta{justify-self:start}
  .idx-head{display:none}
  .row{grid-template-columns:1fr auto;gap:.8rem 1rem;padding:1.6rem 0}
  .r-no{grid-row:1}.r-year{grid-row:1;justify-self:end}
  .r-title{grid-column:1/-1;font-size:clamp(2.4rem,11vw,3.4rem)}
  .r-disc{grid-column:1/-1}
  .r-thumb{display:block;grid-column:1/-1;aspect-ratio:16/9;border-radius:4px;overflow:hidden}
  .r-thumb>*{width:100%;height:100%;object-fit:cover}
  .rows.hov .row{opacity:1}
  .stat{grid-column:1/-1}
  .svc-row{grid-template-columns:2.5rem 1fr}
  .svc-row>div:last-child{grid-column:2}
  .aud,.films,.gal,.c-res{grid-template-columns:1fr}
  .films.vert,.gal.gal3{grid-template-columns:1fr 1fr}
  .steps{grid-template-columns:1fr 1fr}
  .c-back{left:16px;top:58px}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none!important;transition:none!important}
  .js:not(.ready) .hero .ln>span,.case.pre .c-title .ln>span{transform:none}
}

  if(glOk&&heroVisible&&!current&&!reduce)glDraw(now+9000);
  skew+=((Math.max(-6,Math.min(6,vel*.35)))-skew)*.1;
  if(!current){lightWords();redGrow();stepsScroll();if(redVisible&&!reduce&&now-lastFlip>420){lastFlip=now;flip()}}
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
window.addEventListener('scroll',function(){if(!lenis)vel=0},{passive:true});


/* ---------- red screen ---------- */
window.__flipReset=function(){fi=-1;flip()};
var flipEl=$('#flipWord'),fcount=$('#fcount'),redCard=$('#redCard'),fi=0,redVisible=false,lastFlip=0;
function flip(){
  var w=T.mq[lang];fi=(fi+1)%w.length;flipEl.textContent=w[fi];
  fcount.textContent=(fi<9?'0':'')+(fi+1)+' / '+(w.length<10?'0':'')+w.length;
  if(!reduce)flipEl.style.transform='rotate('+((Math.random()*4-2).toFixed(2))+'deg) translateY('+((Math.random()*10-5)|0)+'px)';
}
if('IntersectionObserver' in window)new IntersectionObserver(function(e){redVisible=e[0].isIntersecting}).observe(redCard);
function redGrow(){
  if(current)return;
  var r=redCard.parentNode.getBoundingClientRect(),vh=innerHeight,vw=innerWidth;
  var k=Math.max(0,Math.min(1,(vh*.9-r.top)/(vh*.8)));k=k*k*(3-2*k);
  var ins=Math.min(vw*.14,200)*(1-k);
  redCard.style.marginLeft=redCard.style.marginRight=ins+'px';
  redCard.style.borderRadius=(36*(1-k))+'px';
}


/* ---------- process: line draws and steps light up as you scroll ---------- */
var stepsEl=$('#steps');
function stepsScroll(){
  var st=$$('.step',stepsEl);if(!st.length)return;
  var r=stepsEl.getBoundingClientRect(),vh=innerHeight;
  var p=Math.max(0,Math.min(1,(vh*.85-r.top)/(vh*.55+r.height*.4)));
  st.forEach(function(el,i){var l=Math.max(0,Math.min(1,p*st.length-i));el.style.setProperty('--p',l.toFixed(3));el.classList.toggle('on',l>.35)});
}


/* ---------- logo eye wakes ---------- */
var logoEl=$('#logo');
function wake(){if(reduce||logoEl.classList.contains('wake'))return;logoEl.classList.add('wake')}
logoEl.addEventListener('animationend',function(e){if(e.animationName==='dpup')logoEl.classList.remove('wake')});
logoEl.addEventListener('pointerenter',wake);
setInterval(function(){if(!document.hidden)wake()},14000);

/* ---------- case rendering ---------- */
var current=null,busy=false,suppress=false;
var caseEl=$('#case'),homeEl=$('#home'),txEl=$('#tx');
function renderCase(id,keep){
  var p=byId(id),i=P.indexOf(p),nx=P[(i+1)%P.length];
  var h='';
  h+='<section class="c-hero" style="--pc:'+p.color+'"><div class="c-media">'+media(p)+'</div><div class="c-shade"></div>'+
     '<div class="c-head wrap"><p class="mono">'+p.no+' / '+(P.length<10?'0':'')+P.length+' · '+tx(p.disc)+'</p><h1 class="c-title"><span class="ln"><span>'+tx(p.title)+'</span></span></h1></div></section>';
  h+='<a class="c-back mono" href="#work" data-cursor="go">← '+T.back[lang]+'</a>';
  h+='<div class="wrap"><section class="c-intro"><p class="c-lead">'+tx(p.lead)+'</p><dl class="c-meta mono">'+
     '<div><dt>'+T.lClient[lang]+'</dt><dd>'+tx(p.client)+'</dd></div><div><dt>'+T.lYear[lang]+'</dt><dd>'+p.year+'</dd></div>'+
     (p.dur?'<div><dt>'+T.lDur[lang]+'</dt><dd>'+tx(p.dur)+'</dd></div>':'')+'<div><dt>'+T.lDisc[lang]+'</dt><dd>'+tx(p.disc)+'</dd></div></dl></section>';
  if(p.challenge)h+='<section class="c-block"><h2 class="lbl mono">'+T.lChal[lang]+'</h2><div class="bd"><p class="c-text">'+tx(p.challenge)+'</p></div></section>';
  if(p.did)h+='<section class="c-block"><h2 class="lbl mono">'+T.lDid[lang]+'</h2><div class="bd"><ol class="c-list">'+p.did[lang].map(function(d){return '<li>'+d+'</li>'}).join('')+'</ol>'+(p.link?'<a class="c-link" href="'+p.link.url+'" target="_blank" rel="noopener" data-cursor="go">'+tx(p.link.label)+' <i>↗</i></a>':'')+'</div></section>';
  h+='</div>';
  if(p.hard)h+='<section class="quote wrap"><p>“'+tx(p.hard)+'”</p><span class="mono">'+T.lHard[lang]+'</span></section>';
  h+='<div class="wrap">';
  if(p.res)h+='<section class="c-block" style="--pc2:'+p.c2+'"><h2 class="lbl mono">'+T.lRes[lang]+'</h2><div class="bd c-res">'+p.res.map(function(r){return '<div><b>'+r[0]+'</b><span>'+tx(r[1])+'</span></div>'}).join('')+'</div></section>';
  if(p.partners)h+='<section class="c-block"><h2 class="lbl mono">'+T.lPart[lang]+'</h2><div class="bd c-logos">'+p.partners.map(function(n){return '<img src="assets/partners/'+n+'.png" alt="" loading="lazy" style="height:'+(LOGOH[n]||40)+'px">'}).join('')+'</div></section>';
  if(p.films)h+='<section class="c-block"><h2 class="lbl mono">'+T.lFilms[lang]+'</h2><div class="bd films'+(p.vert?' vert':'')+'">'+p.films.map(function(f){return '<figure class="'+(f.wide?'wide':'')+'" data-cursor="play"><video src="'+f.src+'" poster="'+f.poster+'" controls playsinline preload="none"></video><figcaption class="mono">'+tx(f.cap)+'</figcaption></figure>'}).join('')+'</div></section>';
  if(p.note)h+='<section class="c-block"><h2 class="lbl mono">'+T.lFilms[lang]+'</h2><div class="bd"><p class="c-note">'+tx(p.note)+'</p></div></section>';
  if(p.gal)h+='<section class="c-block" style="border:0;padding-top:0"><h2 class="lbl mono">'+T.lGal[lang]+'</h2><div class="bd gal'+(p.galCols===3?' gal3':'')+'">'+p.gal.map(function(g){return '<figure class="'+g.k+'"'+(g.d?' style="--d:'+g.d+'s"':'')+'>'+(g.v?'<video src="'+g.src+'" poster="'+g.poster+'" muted loop playsinline autoplay preload="metadata"></video>':'<img src="'+g.src+'" alt="" loading="lazy">')+(g.cap?'<figcaption class="mono">'+tx(g.cap)+'</figcaption>':'')+'</figure>'}).join('')+'</div></section>';
  h+='</div>';
  h+='<a class="next" href="#case-'+nx.id+'" data-id="'+nx.id+'" data-cursor="next"><div class="n-media">'+media(nx)+'</div><div class="wrap"><span class="mono" style="color:var(--mute)">'+T.lNext[lang]+' · '+nx.no+'</span><span class="n-title">'+tx(nx.title)+'</span></div></a>';
  caseEl.innerHTML=h;
  $$('video[autoplay]',caseEl).forEach(function(v){var r=v.play();if(r&&r.catch)r.catch(function(){})});
  var nxEl=$('.next',caseEl);
  nxEl.addEventListener('click',function(e){e.preventDefault();openCase(nx.id,$('.n-media',nxEl))});
  document.title=tx(p.title)+' · OK Studio';
}

function showCase(id){
  current=id;renderCase(id);
  homeEl.hidden=true;caseEl.hidden=false;
  pvOn=false;pv.style.opacity=0;
  if(lenis)lenis.scrollTo(0,{immediate:true,force:true});window.scrollTo(0,0);
  caseEl.classList.add('pre');void caseEl.offsetWidth;
  requestAnimationFrame(function(){requestAnimationFrame(function(){caseEl.classList.remove('pre')})});
  if(location.hash!=='#case-'+id){suppress=true;location.hash='case-'+id}
}

function anim(el,frames,dur){
  if(reduce||!el.animate)return Promise.resolve();
  return new Promise(function(res){var a=el.animate(frames,{duration:dur,easing:'cubic-bezier(.76,0,.24,1)',fill:'forwards'});a.onfinish=function(){res()};a.oncancel=function(){res()}});
}

function openCase(id,srcEl){
  var p=byId(id);if(!p||busy)return;busy=true;
  txEl.style.background=p.color;txEl.innerHTML=media(p);
  var v=$('video',txEl);if(v){var r=v.play();if(r&&r.catch)r.catch(function(){});var sv=srcEl&&srcEl.querySelector&&(srcEl.tagName==='VIDEO'?srcEl:srcEl.querySelector('video[data-id="'+id+'"],video'));if(sv&&sv.currentTime)try{v.currentTime=sv.currentTime}catch(e){}}
  var W=innerWidth,H=innerHeight,rect=srcEl&&srcEl.getBoundingClientRect?srcEl.getBoundingClientRect():null;
  txEl.style.display='block';txEl.getAnimations&&txEl.getAnimations().forEach(function(a){a.cancel()});
  var go;
  if(rect&&rect.width>10){
    txEl.style.clipPath='none';
    go=anim(txEl,[{left:rect.left+'px',top:rect.top+'px',width:rect.width+'px',height:rect.height+'px',borderRadius:'6px'},{left:'0px',top:'0px',width:W+'px',height:H+'px',borderRadius:'0px'}],1000);
  }else{
    txEl.style.left='0px';txEl.style.top='0px';txEl.style.width=W+'px';txEl.style.height=H+'px';
    go=anim(txEl,[{clipPath:'inset(100% 0 0 0)'},{clipPath:'inset(0 0 0 0)'}],900);
  }
  pvOn=false;pv.style.opacity=0;
  go.then(function(){
    showCase(id);
    return anim(txEl,[{opacity:1},{opacity:0}],reduce?0:650);
  }).then(function(){txEl.style.display='none';txEl.innerHTML='';txEl.getAnimations&&txEl.getAnimations().forEach(function(a){a.cancel()});busy=false});
}

function closeCase(toHash){
  if(busy)return;busy=true;
  txEl.innerHTML='';txEl.style.background='#efebe4';txEl.style.left='0px';txEl.style.top='0px';txEl.style.width=innerWidth+'px';txEl.style.height=innerHeight+'px';txEl.style.borderRadius='0px';txEl.style.opacity=1;txEl.style.display='block';
  anim(txEl,[{clipPath:'inset(100% 0 0 0)'},{clipPath:'inset(0 0 0 0)'}],800).then(function(){
    current=null;caseEl.hidden=true;caseEl.innerHTML='';homeEl.hidden=false;document.title='OK Studio Folio';
    var tgt=toHash&&toHash.length>1?$(toHash):null;
    if(lenis)lenis.scrollTo(tgt||0,{immediate:true,force:true,offset:-40});else if(tgt)window.scrollTo(0,tgt.getBoundingClientRect().top+scrollY-40);else window.scrollTo(0,0);
    return anim(txEl,[{clipPath:'inset(0 0 0 0)'},{clipPath:'inset(0 0 100% 0)'}],800);
  }).then(function(){txEl.style.display='none';txEl.getAnimations&&txEl.getAnimations().forEach(function(a){a.cancel()});busy=false});
}

window.addEventListener('hashchange',function(){
  if(suppress){suppress=false;return}
  var m=location.hash.match(/^#case-(.+)$/);
  if(m&&byId(m[1])){if(current!==m[1])openCase(m[1],null)}
  else if(current)closeCase(location.hash);
});

/* in-page nav */
document.addEventListener('click',function(e){
  var a=e.target.closest('a[data-nav]');if(!a)return;
  var h=a.getAttribute('href');e.preventDefault();
  if(current){location.hash=h.slice(1);return}
  scrollTo(h==='#top'?0:h);
});
$$('[data-lang]').forEach(function(b){b.addEventListener('click',function(){lang=b.getAttribute('data-lang');renderText()})});

/* clock */
function tick(){try{var f=function(z){return new Intl.DateTimeFormat('en-GB',{hour:'2-digit',minute:'2-digit',timeZone:z}).format(new Date())};$('#clock').textContent='NYC '+f('America/New_York')+' · KYIV '+f('Europe/Kyiv')}catch(e){}}
tick();setInterval(tick,20000);

/* ---------- boot ---------- */
renderText();
var startHash=location.hash.match(/^#case-(.+)$/);
function ready(){document.documentElement.classList.add('ready')}
function boot(){
  if(startHash&&byId(startHash[1])){showCase(startHash[1])}
}
if(reduce){$('#loader').style.display='none';ready();boot()}
else{
  var ln=$('#lnum'),lb=$('#lbar'),t0=performance.now(),D=1900;
  (function step(now){var k=Math.min(1,(now-t0)/D),e=1-Math.pow(1-k,3);ln.textContent=Math.round(e*100);lb.style.width=(e*100)+'%';
    if(k<1)requestAnimationFrame(step);
    else{boot();anim($('#loader'),[{clipPath:'inset(0 0 0 0)'},{clipPath:'inset(0 0 100% 0)'}],900).then(function(){$('#loader').style.display='none'});setTimeout(ready,250);setTimeout(wake,1400)}
  })(t0);
}
})();
</script>
</body>
</html>
